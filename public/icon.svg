<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="108" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.4"/>

  <!-- Sound wave vibration arcs -->
  <path d="M 120 200 A 160 160 0 0 0 120 312" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round" opacity="0.75" />
  <path d="M 392 200 A 160 160 0 0 1 392 312" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round" opacity="0.75" />
  <path d="M 80 160 A 210 210 0 0 0 80 352" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" opacity="0.5" />
  <path d="M 432 160 A 210 210 0 0 1 432 352" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" opacity="0.5" />

  <!-- Center Microphone Capsule -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="206" y="112" width="100" height="170" rx="50" fill="url(#cyanGrad)"/>
    
    <!-- Capsule Mesh lines -->
    <line x1="216" y1="170" x2="296" y2="170" stroke="#030712" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <line x1="216" y1="200" x2="296" y2="200" stroke="#030712" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <line x1="226" y1="230" x2="286" y2="230" stroke="#030712" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- Mic U-Bar Arc -->
    <path d="M 172 232 C 172 322, 340 322, 340 232" fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Base Stem and Stand -->
    <line x1="256" y1="316" x2="256" y2="384" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="186" y1="384" x2="326" y2="384" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- 1000X Beast Lightning Spark -->
  <path d="M 296 90 L 320 140 L 290 145 L 330 200 L 300 155 L 325 150 Z" fill="#fbbf24" filter="url(#glow)"/>
</svg>
